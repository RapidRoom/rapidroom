name: RapidRoom change list

# Keeps the "What RapidRoom adds" table (README) and CHANGES.md in sync with
# rapidroom/changes.json and with the current state of the upstream issues and PRs.
on:
  push:
    branches:
      - main
    paths:
      - 'rapidroom/**'
  pull_request:
    paths:
      - 'rapidroom/**'
      - '.github/README.md'
      - 'CHANGES.md'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Rendered files match changes.json
        run: node rapidroom/status.mjs --check

  refresh:
    # main is protected, so this job can't commit. It fails when the upstream
    # statuses in the change list are out of date; a maintainer then runs
    # `node rapidroom/status.mjs --refresh` and commits the result.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Fetch upstream status and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node rapidroom/status.mjs --refresh
      - name: Fail if the change list is out of date
        run: |
          if git diff --quiet; then echo "Change list is up to date."; exit 0; fi
          git diff --stat
          echo "::error::Upstream statuses changed. Run 'node rapidroom/status.mjs --refresh' and commit."
          exit 1

name: RapidRoom change list

# Validate independent records in PRs. Generate main previews as artifacts;
# release snapshots are attached by rapidroom-release-linux.yml, without bot commits.
on:
  push:
    branches:
      - main
    paths:
      - 'rapidroom/**'
  pull_request:
    paths:
      - 'rapidroom/**'
      - '.github/README.md'
      - 'CHANGES.md'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Test record validation and PR snapshot policy
        run: node --test rapidroom/status-records.test.mjs
      - name: Validate PR records without regenerating shared files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node rapidroom/status.mjs --check --base "$PR_BASE_SHA"

  refresh:
    # Preview only: never commit generated files back onto protected main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Fetch upstream status and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node rapidroom/status.mjs --refresh
      - name: Verify generated preview
        run: node rapidroom/status.mjs --check-generated
      - uses: actions/upload-artifact@v4
        with:
          name: rapidroom-changelog-${{ github.sha }}
          path: |
            CHANGES.md
            .github/README.md
            rapidroom/upstream-status.json
          include-hidden-files: true
          retention-days: 30

# Merge an agent-resolved sync PR (sync/upstream-*) once the sync agent's
# `Sync review: FINAL ACCEPT` covers its exact head and every required check
# passed there. The agent's own merge call is refused by its tool permissions,
# so the merge happens here. See rapidroom/UPSTREAM-SYNC.md ("Sync agent").
name: Upstream sync merge

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI Build, Production CSP, Lint, Frontend Tests, Regression check, RapidRoom change list]
    types: [completed]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Sync PR number (empty checks every open sync/upstream-* PR)
        required: false

concurrency:
  group: upstream-sync-merge
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  merge:
    if: >-
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && github.event.comment.user.login == 'yojen7' &&
         startsWith(github.event.comment.body, 'Sync review: FINAL ACCEPT at '))) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
         startsWith(github.event.workflow_run.head_branch, 'sync/upstream-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Token present
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPSTREAM_SYNC_TOKEN secret is missing; see rapidroom/UPSTREAM-SYNC.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge reviewed sync PRs
        env:
          EVENT_PR: ${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR" ]; then
            prs=$EVENT_PR
          elif [ -n "$RUN_BRANCH" ]; then
            prs=$(gh pr list --head "$RUN_BRANCH" --state open --json number --jq '.[].number')
          else
            prs=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number')
          fi
          for pr in $prs; do
            bash rapidroom/upstream-sync/merge-reviewed.sh "$pr"
          done

name: Frontend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check assistant judge registry and policy
        run: |
          node rapidroom/assist/generate-controls.mjs --check
          node --test rapidroom/assist/judge.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Public MCP reproduction guards
        run: node --test rapidroom/validation/mcp-gap-repro/contract.test.mjs

# Upstream sync: identical renders and every exact-head/base check may merge.
# Render changes stay open for human approval; references are never updated here.
name: Upstream sync

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/CyberTimon/RapidRAW.git
  BRANCH: upstream-sync
  GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Token present
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPSTREAM_SYNC_TOKEN secret is missing; see rapidroom/UPSTREAM-SYNC.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false

      - name: Preserve human review and wait for the initial integration
        id: ready
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO/pulls/179" --jq .merged)" != true ]; then
            echo "Waiting for the initial integration PR #179; no sync attempted." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          blocked=$(gh pr list --head "$BRANCH" --state open --json number,labels --jq '[.[] | select(any(.labels[]; .name == "needs-human" or .name == "rendering-change"))] | .[0].number // empty')
          if [ -n "$blocked" ]; then
            echo "PR #$blocked awaits human review; its branch is preserved." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp rapidroom/upstream-sync/gate.sh "$RUNNER_TEMP/upstream-sync-gate.sh"
          cp rapidroom/upstream-sync/resolve-generated.sh "$RUNNER_TEMP/upstream-sync-resolve-generated.sh"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into a fresh branch
        id: merge
        if: steps.ready.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          upstream_sha=$(git rev-parse --short=8 upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [ "$behind" = 0 ]; then
            echo "main already contains upstream $upstream_sha."
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$BRANCH"
          if git merge --no-ff --no-edit -m "Sync upstream RapidRAW $upstream_sha ($behind commits)" upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            if env -u GH_TOKEN bash "$RUNNER_TEMP/upstream-sync-resolve-generated.sh" "$RUNNER_TEMP/conflicts.txt" > "$RUNNER_TEMP/generated-resolution.log" 2>&1; then
              echo "result=merged" >> "$GITHUB_OUTPUT"
              echo "resolved=lock" >> "$GITHUB_OUTPUT"
              echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            else
              git merge --abort
              {
                echo "Mechanical Cargo.lock resolution failed; the merge was aborted."
                echo '```text'
                tail -n 80 "$RUNNER_TEMP/generated-resolution.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "result=conflict" >> "$GITHUB_OUTPUT"
            fi
          fi
          git log --no-merges --format='- %h %s (%an)' origin/main..upstream/main > "$RUNNER_TEMP/commits.txt"

      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        run: |
          title="Upstream sync needs conflict resolution"
          {
            echo "The daily upstream sync could not merge upstream \`${{ steps.merge.outputs.upstream }}\` (${{ steps.merge.outputs.behind }} commits) into main: Git reports conflicts. An agent resolves them on a branch and opens a PR, following AGENTS.md (keep both behaviours, say what was done). Once that lands, unchanged renders and every exact-head/base hosted check may merge; render changes require human approval."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "**Conflicting files**"
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            if [ -s "$RUNNER_TEMP/generated-resolution.log" ]; then
              echo "**Mechanical Cargo.lock resolution failed**"
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/generated-resolution.log"
              echo '```'
              echo
            fi
            echo "<details><summary>Upstream commits not in main</summary>"
            echo
            sed 's/#\([0-9]\)/#\&#8203;\1/g; s/@/@\&#8203;/g' "$RUNNER_TEMP/commits.txt"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/issue.md"
          existing=$(gh issue list --state open --label upstream-sync --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue.md"
            gh issue comment "$existing" --body "Still conflicting at upstream \`${{ steps.merge.outputs.upstream }}\` ($(date -u +%F))."
          else
            gh issue create --title "$title" --label upstream-sync --label agent:codex --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Push the branch and open the PR
        id: pr
        if: steps.merge.outputs.result == 'merged'
        run: |
          git push "--force-with-lease=refs/heads/$BRANCH:${{ steps.merge.outputs.previous }}" origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Daily upstream sync: merges upstream RapidRAW \`${{ steps.merge.outputs.upstream }}\` (${{ steps.merge.outputs.behind }} commits) into main. May merge only after every required exact-head/base check passes and renders match the committed reference. Render changes stay open for human approval; no reference is re-blessed."
            echo
            if [ "${{ steps.merge.outputs.resolved }}" = lock ]; then
              echo "Mechanically resolved: Cargo.lock (upstream's lock, re-resolved)"
              echo
            fi
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "**Upstream commits**"
            echo
            sed 's/#\([0-9]\)/#\&#8203;\1/g; s/@/@\&#8203;/g' "$RUNNER_TEMP/commits.txt"
          } > "$RUNNER_TEMP/pr.md"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --base main --head "$BRANCH" --label upstream-sync \
              --title "Sync upstream RapidRAW ${{ steps.merge.outputs.upstream }}" --body-file "$RUNNER_TEMP/pr.md"
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Check the exact candidate and merge only unchanged rendering
        if: steps.merge.outputs.result == 'merged'
        run: |
          bash "$RUNNER_TEMP/upstream-sync-gate.sh" \
            "${{ steps.pr.outputs.number }}" "${{ steps.merge.outputs.base }}" "${{ steps.merge.outputs.head }}"

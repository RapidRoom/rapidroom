[package]
name = "rapidroom-mcp-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Local authenticated transport for the running RapidRoom editor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "=2.6.1"
dirs = "=7.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "rapidroom-mcp-stdio"
path = "src/bin/rapidroom-mcp-stdio.rs"

[workspace]
